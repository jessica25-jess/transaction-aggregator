spring.application.name=transaction-aggregator

# ── Database connection ───────────────────────────────────────────────────────
# These are used both to build the JDBC URL and by DatabaseInitializer
# to auto-create the database before Flyway runs.
app.datasource.host=${DB_HOST:localhost}
app.datasource.port=${DB_PORT:5432}
app.datasource.dbname=${DB_NAME:transactions_db}

spring.datasource.url=jdbc:postgresql://${app.datasource.host}:${app.datasource.port}/${app.datasource.dbname}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ── JPA ──────────────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ── Flyway ───────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ── Server ───────────────────────────────────────────────────────────────────
server.port=${SERVER_PORT:8081}

# ── Actuator ─────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# ── Logging ──────────────────────────────────────────────────────────────────
logging.level.com.jessica.transactions=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
